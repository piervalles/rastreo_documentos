services:
  app:
    build: .
    container_name: rastreo_doc_app
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: rastreo_doc
      DB_USERNAME: rastreo_user
      DB_PASSWORD: rastreo_secure_password
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: rastreo_doc_db
    restart: always
    environment:
      MYSQL_DATABASE: rastreo_doc
      MYSQL_USER: rastreo_user
      MYSQL_PASSWORD: rastreo_secure_password
      MYSQL_ROOT_PASSWORD: root_master_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
