<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="100%" height="100%">
  <defs>
    <!-- Gradientes Heráldicos -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- RAMA DE PALMA (LADO DERECHO) -->
  <g id="rama-palma">
    <path d="M150 310 C210 300 260 230 260 140 C260 115 250 95 240 80" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <!-- Hojas de palma estilizadas -->
    <path d="M240 80 C248 88 258 98 266 112 M235 92 C248 104 260 118 268 135 M230 110 C245 125 258 145 264 165 M220 135 C238 152 250 175 255 198 M208 165 C226 185 238 210 240 235 M190 205 C210 225 220 250 220 270 M170 250 C188 270 195 290 195 300" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- RAMA DE LAUREL (LADO IZQUIERDO) -->
  <g id="rama-laurel">
    <path d="M150 310 C90 300 40 230 40 140 C40 115 50 95 60 80" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <!-- Hojas de laurel ovales con bayas rojas -->
    <path d="M60 80 Q50 90 44 102 Q55 100 62 92 Z M54 104 Q42 116 38 130 Q50 126 58 116 Z M48 132 Q34 148 32 165 Q45 158 53 145 Z M46 168 Q32 188 34 208 Q46 195 53 180 Z M52 210 Q42 232 48 252 Q58 236 62 220 Z M66 254 Q60 274 72 292 Q78 274 78 260 Z" fill="url(#leafGrad)"/>
    <!-- Bayas rojas del laurel -->
    <circle cx="56" cy="100" r="3.5" fill="#ef4444"/>
    <circle cx="49" cy="130" r="3.5" fill="#ef4444"/>
    <circle cx="45" cy="165" r="3.5" fill="#ef4444"/>
    <circle cx="50" cy="208" r="3.5" fill="#ef4444"/>
    <circle cx="62" cy="250" r="3.5" fill="#ef4444"/>
  </g>

  <!-- LAZO TRICOLOR EN LA BASE -->
  <g id="lazo-base">
    <path d="M125 315 C135 305 165 305 175 315 C190 330 170 350 150 335 C130 350 110 330 125 315 Z" fill="#b91c1c"/>
    <path d="M135 313 C142 308 158 308 165 313 C175 323 160 338 150 328 C140 338 125 323 135 313 Z" fill="#ffffff"/>
    <circle cx="150" cy="320" r="5" fill="#991b1b"/>
    <!-- Cintas colgantes -->
    <path d="M140 330 Q130 350 120 358 Q130 350 142 338 Z" fill="#b91c1c"/>
    <path d="M160 330 Q170 350 180 358 Q170 350 158 338 Z" fill="#b91c1c"/>
  </g>

  <!-- CORONA CÍVICA SUPERIOR (ENCINAS CON LAZO) -->
  <g id="corona-civica">
    <ellipse cx="150" cy="42" rx="36" ry="14" fill="none" stroke="#166534" stroke-width="7" stroke-dasharray="8 4"/>
    <ellipse cx="150" cy="42" rx="36" ry="14" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="6 4"/>
    <!-- Cinta roja que ata la corona -->
    <path d="M142 42 Q150 48 158 42 Q150 36 142 42 Z" fill="#b91c1c"/>
    <path d="M145 44 L138 56 M155 44 L162 56" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- BLASÓN PRINCIPAL (ESCUDO POLACO CON MOLDURA DORADA) -->
  <g id="blason-escudo">
    <!-- Silueta exterior del escudo -->
    <path d="M75 55 
             H225 
             C232 55 238 61 238 68 
             V165 
             C238 235 150 280 150 280 
             C150 280 62 235 62 165 
             V68 
             C62 61 68 55 75 55 Z" 
          fill="#ffffff" 
          stroke="url(#goldGrad)" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Ribete dorado interno -->
    <path d="M80 62 
             H220 
             V165 
             C220 228 150 270 150 270 
             C150 270 80 228 80 165 
             Z" 
          fill="none" 
          stroke="#ca8a04" 
          stroke-width="1.5"/>

    <!-- DIVISIONES DEL ESCUDO EN 3 CAMPOS -->
    <clipPath id="shieldClip">
      <path d="M80 62 H220 V165 C220 228 150 270 150 270 C150 270 80 228 80 165 Z"/>
    </clipPath>

    <g clip-path="url(#shieldClip)">
      <!-- 1. CAMPO SUPERIOR IZQUIERDO: CELESTE (VICUÑA) -->
      <rect x="75" y="55" width="75" height="110" fill="url(#skyGrad)"/>
      
      <!-- 2. CAMPO SUPERIOR DERECHO: BLANCO (ÁRBOL DE LA QUINA) -->
      <rect x="150" y="55" width="85" height="110" fill="#ffffff"/>
      
      <!-- 3. CAMPO INFERIOR: ROJO (CORNUCOPIA) -->
      <rect x="75" y="165" width="160" height="115" fill="url(#redGrad)"/>

      <!-- Líneas divisorias en oro -->
      <line x1="150" y1="55" x2="150" y2="165" stroke="url(#goldGrad)" stroke-width="3"/>
      <line x1="75" y1="165" x2="225" y2="165" stroke="url(#goldGrad)" stroke-width="3"/>

      <!-- ============================================== -->
      <!-- FIGURA 1: LA VICUÑA (REINO ANIMAL)             -->
      <!-- ============================================== -->
      <g id="vicuna" transform="translate(85, 75)">
        <!-- Pradera verde suelo -->
        <ellipse cx="28" cy="78" rx="26" ry="6" fill="#15803d"/>
        <!-- Sombra patas -->
        <ellipse cx="28" cy="78" rx="20" ry="3" fill="#0f172a" opacity="0.3"/>
        <!-- Cuerpo y lomo de la Vicuña (Canela/Ocre y pecho blanco) -->
        <!-- Patas traseras -->
        <path d="M38 52 L42 75 M44 55 L48 74" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
        <!-- Patas delanteras -->
        <path d="M18 52 L16 75 M23 54 L22 74" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
        <!-- Torso -->
        <ellipse cx="30" cy="48" rx="16" ry="11" fill="#d97706"/>
        <!-- Pecho y vientre blanco sedoso característico -->
        <path d="M18 45 Q22 56 34 56 Q24 50 18 45 Z" fill="#ffffff"/>
        <!-- Cuello esbelto erguido -->
        <path d="M18 48 C16 38 18 24 23 16 C26 24 24 38 23 48 Z" fill="#d97706"/>
        <path d="M17 44 Q19 28 22 20 Q19 32 17 44 Z" fill="#ffffff"/>
        <!-- Cabeza y orejas alargadas mirando a la derecha (diestra heráldica) -->
        <ellipse cx="24" cy="15" rx="5" ry="4" fill="#d97706"/>
        <path d="M26 13 Q31 15 28 17 Z" fill="#b45309"/> <!-- hocico -->
        <!-- Orejas atentas -->
        <path d="M22 13 L20 6 L23 10 M24 12 L24 5 L26 10" stroke="#b45309" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Ojo -->
        <circle cx="25" cy="14" r="1.2" fill="#0f172a"/>
        <!-- Cola corta -->
        <path d="M44 45 Q48 50 46 54" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
      </g>

      <!-- ============================================== -->
      <!-- FIGURA 2: EL ÁRBOL DE LA QUINA (REINO VEGETAL) -->
      <!-- ============================================== -->
      <g id="arbol-quina" transform="translate(155, 68)">
        <!-- Suelo pradera -->
        <ellipse cx="30" cy="85" rx="25" ry="5" fill="#15803d"/>
        <!-- Tronco leñoso robusto -->
        <path d="M28 85 L29 55 Q24 45 18 36 M30 55 Q36 44 42 38 M29 50 L30 32" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M28 85 L29 55 Q24 45 18 36 M30 55 Q36 44 42 38 M29 50 L30 32" stroke="#a16207" stroke-width="2" stroke-linecap="round"/>
        <!-- Copa frondosa y redondeada con reflejos rojizos/verdes -->
        <circle cx="30" cy="24" r="14" fill="#15803d"/>
        <circle cx="18" cy="34" r="12" fill="#166534"/>
        <circle cx="42" cy="34" r="12" fill="#14532d"/>
        <circle cx="30" cy="38" r="13" fill="#16a34a"/>
        <!-- Hojas de quina detalladas -->
        <circle cx="24" cy="22" r="7" fill="#22c55e" opacity="0.6"/>
        <circle cx="36" cy="28" r="8" fill="#4ade80" opacity="0.5"/>
        <circle cx="28" cy="36" r="6" fill="#86efac" opacity="0.5"/>
        <!-- Puntas rojizas de las hojas de quina (características botánicas) -->
        <circle cx="16" cy="26" r="2.5" fill="#dc2626"/>
        <circle cx="44" cy="26" r="2.5" fill="#dc2626"/>
        <circle cx="30" cy="12" r="2.5" fill="#dc2626"/>
      </g>

      <!-- ============================================== -->
      <!-- FIGURA 3: LA CORNUCOPIA (REINO MINERAL)        -->
      <!-- ============================================== -->
      <g id="cornucopia" transform="translate(85, 170)">
        <!-- Cuerno de la abundancia dorado derramando hacia la izquierda -->
        <!-- Cola enroscada del cuerno -->
        <path d="M125 32 C115 15 95 18 80 25 C60 35 45 52 35 60" 
              fill="none" 
              stroke="url(#goldGrad)" 
              stroke-width="12" 
              stroke-linecap="round"/>
        <!-- Cuerpo estriado del cuerno -->
        <path d="M120 30 C100 20 70 35 40 55 C32 60 25 70 20 78 L45 88 C55 76 65 65 85 52 C105 40 125 45 120 30 Z" 
              fill="url(#goldGrad)" 
              stroke="#ca8a04" 
              stroke-width="1.5"/>
        <!-- Anillos / Estrías heráldicas del cuerno -->
        <path d="M95 32 Q100 42 105 40 M75 42 Q82 52 88 50 M58 55 Q65 67 72 65 M42 70 Q48 80 54 78" 
              stroke="#713f12" 
              stroke-width="2" 
              fill="none"/>
        <!-- Boca ancha del cuerno de oro -->
        <ellipse cx="26" cy="80" rx="9" ry="16" fill="#713f12" stroke="url(#goldGrad)" stroke-width="3"/>

        <!-- Cascada de monedas de oro brillantes derramándose -->
        <g id="monedas-oro">
          <!-- Monedas acumuladas en cascada -->
          <ellipse cx="18" cy="82" rx="6" ry="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
          <ellipse cx="14" cy="74" rx="6" ry="4" fill="#facc15" stroke="#a16207" stroke-width="1.2"/>
          <ellipse cx="10" cy="84" rx="6" ry="4" fill="#eab308" stroke="#854d0e" stroke-width="1.2"/>
          <ellipse cx="22" cy="72" rx="5" ry="3.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
          
          <ellipse cx="6" cy="90" rx="5.5" ry="3.5" fill="#fde047" stroke="#a16207" stroke-width="1.2"/>
          <ellipse cx="14" cy="92" rx="6" ry="4" fill="#facc15" stroke="#713f12" stroke-width="1.2"/>
          <ellipse cx="24" cy="90" rx="6.5" ry="4" fill="#eab308" stroke="#a16207" stroke-width="1.2"/>
          
          <ellipse cx="32" cy="94" rx="5" ry="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
          <ellipse cx="2" cy="98" rx="5" ry="3" fill="#facc15" stroke="#854d0e" stroke-width="1.2"/>
          <ellipse cx="10" cy="100" rx="6" ry="3.5" fill="#fde047" stroke="#a16207" stroke-width="1.2"/>
          <ellipse cx="18" cy="98" rx="6" ry="3.5" fill="#eab308" stroke="#713f12" stroke-width="1.2"/>
          <ellipse cx="26" cy="101" rx="5.5" ry="3" fill="#facc15" stroke="#a16207" stroke-width="1.2"/>
          
          <!-- Monedas dispersas en la base -->
          <ellipse cx="38" cy="98" rx="5" ry="2.5" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
          <ellipse cx="48" cy="100" rx="5" ry="2.5" fill="#facc15" stroke="#a16207" stroke-width="1"/>
          <ellipse cx="-4" cy="101" rx="4.5" ry="2.5" fill="#fde047" stroke="#854d0e" stroke-width="1"/>
        </g>
      </g>
    </g>
  </g>
</svg>
